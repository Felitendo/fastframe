[package]
name = "fastframe-audio"
description = "Audio output for egui apps: a device stream that really idles when paused, follows the default device and reopens after failures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["audio", "cpal", "output", "egui", "desktop"]
categories = ["multimedia::audio"]

[features]
# cpal's native PulseAudio backend (pure Rust), which Solco uses so its fixed
# buffer replaces PulseAudio's ~2 s default target.
pulseaudio = ["cpal/pulseaudio"]
# cpal's PipeWire backend. Builds bindings against libpipewire, so it needs
# its headers and clang; off by default.
pipewire = ["cpal/pipewire"]

[dependencies]
# The device stream. 0.18 is the version Solco builds with and kira 0.12
# requires; Spotifast and ZapFast reach cpal through rodio today.
cpal = "0.18.1"
# Device changes, reopens and errors are logged as the other crates log.
log.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Registers the stream's thread with the Multimedia Class Scheduler Service.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

# Raises the feeding thread's QoS class (macOS) or nice value (Linux). Already
# in every app's tree, through cpal among others.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

# The workspace forbids unsafe code. Joining MMCSS and raising a thread's
# priority are one OS call each, so this crate carries the workspace's lints
# with `unsafe_code` lowered to `deny`, allowed only in `mmcss.rs` and
# `feeder.rs`, with a SAFETY note on each call.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
